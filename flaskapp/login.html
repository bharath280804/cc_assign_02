<!DOCTYPE html>
<html>
<head>
    <title>Account Re-Login</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f8f1ec, #fdf8f4);
            color: #3d2c2e;
        }

        .container {
            max-width: 460px;
            margin: auto;
            background: #fffaf8;
            padding: 34px;
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(93, 64, 55, 0.12);
            border: 1px solid #f0dfd8;
        }

        h2 {
            text-align: center;
            color: #6d3b47;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #8a6a70;
            margin-bottom: 24px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: 600;
            color: #5c4046;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dec8c2;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
            transition: 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #b76e79;
            box-shadow: 0 0 0 3px rgba(183, 110, 121, 0.15);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #8b4f5d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #733d4a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <div class="subtitle">Enter your username and password to retrieve your information.</div>

        <form action="/relogin" method="POST">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
